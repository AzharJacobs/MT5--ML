# USTEC Zone-to-Zone strategy — single source of truth
# Loaded by both backtest.py and live_bot_zz.py.
# Edit here; do NOT duplicate these values in Python files.

symbol: USTECm          # Exness symbol name (live/demo MT5)
db_name: ustech_ohlcv   # PostgreSQL database
table: ustech_ohlcv     # OHLCV table
contract_size: 1.0      # $1/pt/lot (Exness USTECm — verified; engine uses 1.0)

# Execution
spread_pts: 2.0         # applied at fill in paper mode; MT5 uses real fill
fixed_lot: 0.05         # fixed lot size per trade
risk_pct: 0.01          # 1% equity risk (used only with dynamic lot sizing)
min_rr: 2.5
min_sl_pct: 0.0         # disabled
max_sl_pct: 0.0         # disabled
max_positions: 2
h4_window: 150
m15_window: 80

# Zone detection (fed to ZoneConfig)
zone:
  impulse_atr_mult: 2.0
  body_ratio_min: 0.50
  min_departure_candles: 2
  departure_window: 6
  base_lookback: 5
  min_strength: 1.5
  tap_tolerance_pct: 0.001
  max_zone_height_atr: 2.5   # discard H4 zones wider than 2.5×ATR (cuts ~400pt+ monstrosities)

# Timeframe (H4 bias + M15 entry)
timeframe:
  directional_filter: true
  allow_neutral: false
  h4_swing_left: 2
  h4_swing_right: 2
  prefer_fresh_h4: true
  m15_tap_lookback: 20
  require_m15_directional_close: false

# Confirmations — all 5 signals active (no gold-style disabling)
confirmations:
  min_confirmations: 2
  aggressive_boundary: false
  # structure_shift has poor standalone WR — excluded so it cannot satisfy
  # min_confirmations alone.  It still fires and is logged for analysis.
  excluded_from_count: [structure_shift]
  active_signals: [engulfing, rejection_wick, bos_msb, structure_shift, choch]
  engulf_full_body: true
  wick_ratio_min: 0.60
  body_ratio_max: 0.35
  close_in_upper_half: true
  bos_lookback: 15
  bos_swing_n: 2
  structure_lookback: 25
  structure_swing_n: 2
  choch_lookback: 20
  choch_swing_left: 2
  choch_swing_right: 2
  choch_min_swings: 2

# Trade setup
trade_setup:
  aggressive_entry: false
  sl_buffer_pct: 0.002
  sl_min_points: 0.0
  midline_tp: false
  midline_pct: 0.50
  tp_prefer_fresh: true
  use_m15_sl: false           # PDF rule: SL below/above the ZONE — never inside it
  m15_sl_atr_floor_mult: 0.5  # SL must be >= 0.5×ATR14 from entry (noise guard)

# Cooldown
cooldown:
  require_leave_and_return: true
  cooldown_bars: 15            # ≈4h minimum floor after a win
  cooldown_loss_h: 12          # hours to block zone after a loss (≈48 × M15 bars)
  cooldown_win_floor_h: 3.75   # minimum hours after win before leave-and-return eligible
  max_forward_bars: 350        # 350 × 15 min ≈ 87 h ≈ 4 trading days
  zone_max_losses: 3           # not a PDF rule — kept as guard, relaxed from 1 (was killing trades)

# Regime filter — blocks buys when price is below both H4 EMA50 and EMA200
regime:
  h4_regime_filter: false      # not in PDF + tested net-negative over 3yrs — OFF

# D1 trend filter — highest priority gate: price > D1 EMA -> buy only, price < D1 EMA -> sell only
d1_trend:
  d1_trend_filter: false       # tested: cut trades, cut PnL more than risk — OFF (didn't win)
  d1_ema_period: 200           # D1 = H4 resampled to calendar days (6 H4 bars/day)

# Session window — block NEW entries outside these server-time hours; open positions still managed
session:
  trading_hours: [8, 18]       # null/omit to disable

# Pyramiding — at +pyramid_trigger_r, move original SL to breakeven and open one
# same-size add-on (same TP, SL at position 1's entry). Max 1 add-on per trade.
pyramid:
  pyramid_enabled: false
  pyramid_trigger_r: 1.0

# Trailing stop (USTEC only — not shared with gold)
trailing:
  enable_trailing: true
  be_trigger_pts: 30.0         # move SL to BE once price moves this many pts in profit
  be_buffer_pts: 5.0           # pts above/below entry for the BE stop (entry + buffer)
  atr_trail_mult: 0.0          # ATR backstop disabled — swing trail handles SL progression
  trail_on_confirmed_swing_only: true