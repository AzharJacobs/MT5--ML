# XAUUSD (Gold) Zone-to-Zone strategy — single source of truth
# Loaded by both backtest.py and the gold live bot.
# Edit here; do NOT duplicate these values in Python files.

symbol: XAUUSD
db_name: XAUUSD
table: xauusd_ohlcv
contract_size: 100.0

# Execution
spread_pts: 0.0
fixed_lot: 0.0       # 0 = dynamic 1% risk sizing
risk_pct: 0.01
min_rr: 1.5
max_positions: 2
h4_window: 150
m15_window: 80

# Zone detection (fed to ZoneConfig)
zone:
  impulse_atr_mult: 2.0
  body_ratio_min: 0.50
  min_departure_candles: 2
  departure_window: 6
  base_lookback: 5
  min_strength: 1.5
  tap_tolerance_pct: 0.001

# Timeframe (H4 bias + M15 entry)
timeframe:
  directional_filter: true
  allow_neutral: true
  h4_swing_left: 2
  h4_swing_right: 2
  m15_tap_lookback: 20
  require_m15_directional_close: true

# Confirmations
confirmations:
  min_confirmations: 1
  aggressive_boundary: false
  # active_signals: only these count toward min_confirmations for entry.
  # All fired signals are still logged for post-analysis.
  # Disabled for gold: structure_shift (24% WR, -$3,890 net), bos_msb (26% WR, -$1,017 net).
  active_signals: [engulfing, rejection_wick, choch]
  bos_lookback: 15
  structure_lookback: 25

# Trade setup
trade_setup:
  aggressive_entry: false
  sl_buffer_pct: 0.002    # base % buffer; sl_atr_buffer adds on top
  midline_tp: false
  midline_pct: 0.50

# Cooldown
cooldown:
  require_leave_and_return: true
  cooldown_bars: 15         # floor after a win (bars)
  cooldown_loss_bars: 48    # block duration after a loss (bars = 12h in M15)
  max_forward_bars: 350     # 350 × 15 min ≈ 87 h ≈ 4 trading days

# Gold-specific fixes (absent in USTEC config)
gold_fixes:
  # Fix 1: zones that produce a SL hit are permanently blacklisted.
  # USTEC uses 48-bar cooldown instead.
  failed_zone_filter: true

  # Fix 3a: skip zones narrower than this fraction of H4 ATR(14).
  # 0.30 → minimum zone ≈ $12–$27 at current gold prices (filters ~40% of zones).
  min_zone_atr_frac: 0.30

  # Fix 3b: widen SL by this fraction of H4 ATR beyond the zone edge.
  # At H4 ATR ≈ $50 this adds ~$10 buffer on top of sl_buffer_pct.
  sl_atr_buffer: 0.20
